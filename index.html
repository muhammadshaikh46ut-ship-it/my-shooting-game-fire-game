<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Snake Game</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        h2 { color: #00ffcc; margin: 10px 0; }
        canvas {
            border: 4px solid #ff4500;
            background-color: #000;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.5);
            max-width: 90vw;
            height: auto;
        }
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 10px;
            justify-content: center;
        }
        .ctrl-btn {
            background-color: #333;
            color: white;
            border: 2px solid #00ffcc;
            padding: 20px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
        }
        .ctrl-btn:active { background-color: #00ffcc; color: black; }
        .score-board { font-size: 22px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🐍 Real Snake Game 🐍</h2>
    <div class="score-board">Score: <span id="score">0</span></div>

    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <div class="controls">
        <div></div>
        <button class="ctrl-btn" onclick="changeDirection('UP')">⬆️</button>
        <div></div>
        <button class="ctrl-btn" onclick="changeDirection('LEFT')">⬅️</button>
        <button class="ctrl-btn" onclick="changeDirection('DOWN')">⬇️</button>
        <button class="ctrl-btn" onclick="changeDirection('RIGHT')">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let score = 0;
        let snake = [{ x: 9 * box, y: 10 * box }];
        let food = { x: Math.floor(Math.random() * 15) * box, y: Math.floor(Math.random() * 15) * box };
        let d = "RIGHT";

        function changeDirection(dir) {
            if (dir == "LEFT" && d != "RIGHT") d = "LEFT";
            else if (dir == "UP" && d != "DOWN") d = "UP";
            else if (dir == "RIGHT" && d != "LEFT") d = "RIGHT";
            else if (dir == "DOWN" && d != "UP") d = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#00ffcc" : "#ffffff";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#ff4500";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            if (snakeX == food.x && snakeY == food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                food = { x: Math.floor(Math.random() * 15) * box, y: Math.floor(Math.random() * 15) * box };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            // Wall Collision & Self Collision
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                alert("Game Over! Your final score is: " + score);
                location.reload();
            }
            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        let game = setInterval(draw, 120);
    </script>
</body>
</html>
