<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Rank Ludo Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 15px;
        }
        .game-card {
            border: 2px solid #ff4500;
            border-radius: 12px;
            padding: 20px;
            max-width: 380px;
            margin: auto;
            background-color: #1e1e1e;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.3);
        }
        .btn {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .leaderboard {
            background-color: #2b2b2b;
            border-radius: 8px;
            padding: 10px;
            margin-top: 20px;
            text-align: left;
        }
        .leaderboard h3 {
            text-align: center;
            color: #ffcc00;
            margin-top: 0;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #444;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h2>🎲 Ludo India King 🎲</h2>
        
        <div>
            <p>Dice Number: <span id="diceValue" style="font-size: 24px; color: #ffcc00; font-weight: bold;">-</span></p>
            <p>Your Score: <span id="score">0</span></p>
        </div>

        <button class="btn" onclick="rollDice()">🎲 Roll Dice</button>

        <div class="leaderboard">
            <h3>🏆 India Leaderboard 🏆</h3>
            <div class="rank-item"><span>1. Rahul (Delhi)</span> <span>500 pts</span></div>
            <div class="rank-item"><span>2. Amit (Mumbai)</span> <span>420 pts</span></div>
            <div class="rank-item"><span>3. Priya (Bangalore)</span> <span>350 pts</span></div>
            <div class="rank-item" style="color: #00ffcc; font-weight: bold;">
                <span>👑 You (Top 1)</span> <span id="myRankScore">0 pts</span>
            </div>
        </div>
    </div>

    <script>
        let score = 0;

        function rollDice() {
            let dice = Math.floor(Math.random() * 6) + 1;
            document.getElementById("diceValue").innerText = dice;
            
            score += dice * 10;
            document.getElementById("score").innerText = score;
            document.getElementById("myRankScore").innerText = score + " pts";
        }
    </script>

</body>
</html>
