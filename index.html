<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Shooting Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .game-card {
            border: 2px solid #ff4500;
            border-radius: 12px;
            padding: 20px;
            max-width: 350px;
            margin: auto;
            background-color: #1e1e1e;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.3);
        }
        .btn {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h2>🔥 Fire Shooter 🔥</h2>
        
        <div class="stats">
            <div>Score: <span id="score">0</span></div>
            <div>Enemy HP: <span id="hp">100</span>%</div>
        </div>

        <p id="message">Enemy is ahead! Shoot now!</p>

        <button id="fireBtn" class="btn" onclick="shoot()">🎯 FIRE</button>
        <button id="restartBtn" class="btn" onclick="resetGame()" style="display:none; background-color: #28a745;">🔄 Restart</button>
    </div>

    <script>
        let hp = 100;
        let score = 0;

        function shoot() {
            if (hp > 0) {
                hp -= 10;
                score += 10;
                document.getElementById("hp").innerText = hp;
                document.getElementById("score").innerText = score;

                if (hp <= 0) {
                    document.getElementById("message").innerText = "🎉 You defeated the enemy!";
                    document.getElementById("fireBtn").style.display = "none";
                    document.getElementById("restartBtn").style.display = "inline-block";
                }
            }
        }

        function resetGame() {
            hp = 100;
            score = 0;
            document.getElementById("hp").innerText = hp;
            document.getElementById("score").innerText = score;
            document.getElementById("message").innerText = "Enemy is ahead! Shoot now!";
            document.getElementById("fireBtn").style.display = "inline-block";
            document.getElementById("restartBtn").style.display = "none";
        }
    </script>

</body>
</html>
